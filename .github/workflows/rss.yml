name: fmfeed
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmfeed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps & chromium
        working-directory: scraper
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # cron 밀림과 별개로 실행 시각 지터를 줌
      - name: Jitter
        run: sleep $(( (RANDOM % 300) ))

      - name: Generate feed
        run: node scraper/scraper.mjs

      - name: Commit feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "No changes to feed.xml"
          else
            git commit -m "chore: update feed.xml [skip ci]"
            git push
          fi
